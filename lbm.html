<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>런던베이글</title>
<link rel="apple-touch-icon" href="icons/lbm.png">
<link rel="icon" type="image/png" href="icons/lbm.png">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d2329;--sub:#5d646b;--line:#e2ded6;--navy:#1f2d3d}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:420px;margin:0 auto;padding:32px 20px}
.lg{display:block;width:96px;height:96px;border-radius:22px;border:1px solid var(--line);margin:0 auto 20px}
h1{font-size:22px;margin:0 0 6px;text-align:center}
.nm{text-align:center;color:var(--sub);margin:0 0 18px}
ol{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 36px;margin:0 0 12px}
li{margin:4px 0}
.s{color:var(--sub);font-size:14px;margin:0 0 20px;text-align:center}
.go{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:14px;font-weight:600}
.go:focus-visible{outline:2px solid #f0b48f;outline-offset:2px}
.w{background:#fff4e5;border:1px solid #f0c98f;color:#7a4a10;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.lk{color:var(--sub)}
</style>
</head>
<body>
<main><img class="lg" src="icons/lbm.png" alt=""><div id="m"><p>여는 중…</p></div></main>
<script src="go.js"></script>
</body>
</html>
